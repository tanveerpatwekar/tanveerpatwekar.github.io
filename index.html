<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocketfold Apps</title>
<meta name="description" content="Simple, calm Android apps by Pocketfold Apps.">
<style>
  :root { color-scheme: light dark; --text: #1c1c1e; --muted: #6c6c70; --bg: #f2f2f7; --card: #ffffff; --link: #007aff; }
  @media (prefers-color-scheme: dark) { :root { --text: #f2f2f7; --muted: #a1a1a6; --bg: #000000; --card: #1c1c1e; --link: #0a84ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 40px 0 12px; }
  p { margin: 0; }
  .lead { color: var(--muted); }
  .app { display: flex; gap: 16px; align-items: center; background: var(--card); border-radius: 20px; padding: 16px; }
  .app img { width: 64px; height: 64px; border-radius: 15px; flex: none; }
  .app h3 { font-size: 19px; margin: 0 0 2px; }
  .app p { color: var(--muted); font-size: 15px; }
  .links { margin-top: 6px; font-size: 15px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Pocketfold Apps</h1>
  <p class="lead">Small, calm Android apps that do one job well.</p>

  <h2>Apps</h2>
  <div class="app">
    <img src="vaultcalc/icon.png" alt="VaultCalc icon">
    <div>
      <h3>VaultCalc</h3>
      <p>EMI, SIP, FD and GST calculators for India, in English and Hindi.</p>
      <p class="links">Coming soon to Google Play · <a href="vaultcalc/privacy.html">Privacy policy</a></p>
    </div>
  </div>

  <h2>Support</h2>
  <p>Questions or feedback? Email <a href="mailto:pocketfold.apps@gmail.com">pocketfold.apps@gmail.com</a>.</p>

  <footer>© 2026 Pocketfold Apps</footer>
</main>
</body>
</html>
